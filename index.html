<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const queryString = window.location.search;

      // Read everything after "?url=" as the destination URL,
      // including additional parameters such as &sessionId and &uname.
      if (!queryString.startsWith('?url=')) {
        showError();
        return;
      }

      const rawRedirectUrl = queryString.substring(5);

      try {
        // Supports both encoded and non-encoded URLs.
        let redirectUrl;

        try {
          redirectUrl = decodeURIComponent(rawRedirectUrl);
        } catch (_) {
          redirectUrl = rawRedirectUrl;
        }

        const targetUrl = new URL(redirectUrl);

        // Allow only normal web URLs.
        if (
          targetUrl.protocol !== 'https:' &&
          targetUrl.protocol !== 'http:'
        ) {
          throw new Error('Unsupported URL protocol');
        }

        window.location.replace(targetUrl.href);
      } catch (error) {
        showError();
      }
    });

    function showError() {
      document.body.innerHTML =
        '<h1>Invalid or missing redirect URL</h1>';
    }
  </script>
</head>

<body>
  <h3>Loading...</h3>
</body>
</html>
